cv:
  name: Gautam Rajendrakumar Gare
  label: Ph.D. Candidate, Robotics Institute, Carnegie Mellon University
  email: ggare@andrew.cmu.edu
  location: Pittsburgh, PA
  image: ""
  summary: >
    I make frozen vision-language models do new things without touching their weights, treating
    adaptation as an inference-time problem: optimizing prompts (DetPO, ECCV 2026), selecting
    image-conditioned attributes, and reading activations (ACL Findings 2026). I study when and
    why multimodal models generalize (ICML 2024 Oral) and prove these methods in medical
    imaging (5 ISBI papers, 4 U.S. patents). On the job market for research scientist roles
    (graduating late 2026).

