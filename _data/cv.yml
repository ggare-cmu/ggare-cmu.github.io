    Research Experience:
      - bullet: "**Soft-Prompt Tuning of Vision-Language Models for Few-Shot Object Detection** · Robotics Institute, CMU · *Nov 2025 – Present*. Designed a soft-prompting framework that learns continuous prompt embeddings via gradient-based optimization, enabling task adaptation without modifying VLM weights. Outperformed LoRA fine-tuning in the 10-shot setting, showing lightweight prompt optimization can match or exceed parameter-efficient fine-tuning at low data regimes."
      - bullet: "**Iterative Prompt Optimization for Few-Shot Object Detection (DetPO)** · Robotics Institute, CMU · *Sep 2025 – Jan 2026*. Developed an iterative prompt-optimization framework using false-positive and false-negative feedback to improve few-shot detection. Achieved state-of-the-art results with contemporary VLMs (e.g., Qwen3, Gemini3) on the RF20 dataset, outperforming specialist models such as GroundingDINO in a black-box setting."
      - bullet: "**Causal Discovery for Classification** · Robotics Institute, CMU · *Jan 2023 – Aug 2025*. Designed a Markov-blanket-based causal discovery algorithm for feature selection. Demonstrated improved accuracy and interpretability on medical datasets."
      - bullet: "**Generic Human-Interpretable Lung Ultrasound Biomarkers** · Biomedical Image Guidance Lab, CMU · *2021 – 2025*. Developed interpretable lung ultrasound biomarkers enabling causal and contrastive learning for diagnosis. Showed biomarker-based features match deep features in downstream performance."

    Professional Experience:
      - bullet: "**AI Research Intern** · Robert Bosch LLC (Bosch Research), Pittsburgh, PA · *May 2026 – Aug 2026*. Researched grounding of vision-language-action (VLA) models for autonomous-vehicle applications, connecting language-conditioned action reasoning to visual scene evidence."
      - bullet: "**Computer Vision Research Intern** · DawnLight Inc., Palo Alto, CA · *Jun 2021 – Aug 2021*. Developed efficient multimodal action recognition networks (RGB + IR) for clinical monitoring."
      - bullet: "**Senior Data Scientist & Software Engineer** · Sling Media R&D (Dish Networks), Bangalore, India · *Jul 2016 – Jul 2019*. Led analytics pipeline for user churn modeling and AirTV Player Android app interface optimization. Improved image caching, reducing app startup time by 20%."
      - bullet: "**Summer Research Fellow** · IIEST, Shibpur, India · *Jun 2015 – Jul 2015*. Built a real-time tele-operated robotic arm system with RGB-D feedback."

